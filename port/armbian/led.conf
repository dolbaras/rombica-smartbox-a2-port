# Rombica SmartBox A2 front LED: the kernel LED trigger of each colour, read by udev when the LEDs
# appear (/etc/udev/rules.d/90-rombica-led.rules) and written by the "Индикатор" window.
# Red is shown over blue. none = off, default-on = on, heartbeat, mmc1 = microSD activity,
# rc-feedback = remote key press.
BLUE=default-on
RED=none
