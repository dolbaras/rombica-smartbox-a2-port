# Rombica SmartBox A2 (S905L2, Armbian mainline): software decoding in mpv itself.
# mpv 0.35 crashes on the meson-vdec H.264 decoder (v4l2m2m); for hardware H.264 use yt-play
# (ffmpeg decodes, mpv only shows the frames). The chip has no VP9 hardware, HEVC has no mainline
# driver for GXL, and the MPEG-2 path hangs the decoder.
vo=gpu
gpu-context=x11egl
