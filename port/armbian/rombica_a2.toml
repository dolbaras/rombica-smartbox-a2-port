# Rombica SmartBox A2 remote (cyxtech cs918, NEC customcode 0x4040), from the stock DTB.
# Scancodes as decoded by the kernel (NEC extended, address 0x4040).
[[protocols]]
name = "rombica_a2"
protocol = "nec"
[protocols.scancodes]
0x404000 = "KEY_0"
0x404001 = "KEY_1"
0x404002 = "KEY_2"
0x404003 = "KEY_3"
0x404004 = "KEY_4"
0x404005 = "KEY_5"
0x404006 = "KEY_6"
0x404007 = "KEY_7"
0x404008 = "KEY_8"
0x404009 = "KEY_9"
0x40400b = "KEY_UP"
0x40400c = "KEY_BACKSPACE"
0x40400d = "KEY_ENTER"
0x40400e = "KEY_DOWN"
0x404010 = "KEY_LEFT"
0x404011 = "KEY_RIGHT"
0x404015 = "KEY_VOLUMEUP"
0x40401a = "KEY_HOMEPAGE"
0x40401c = "KEY_VOLUMEDOWN"
0x40401e = "KEY_PAGEUP"
0x40401f = "KEY_PAGEDOWN"
0x404042 = "KEY_BACK"
0x404043 = "KEY_MUTE"
0x404044 = "KEY_PROG1"   # mouse key: toggles mouse mode (rc-mouse)
0x404045 = "KEY_MENU"
0x40404d = "KEY_POWER"
0x404053 = "KEY_VIDEO"
0x404054 = "KEY_AUDIO"
0x404057 = "KEY_SCROLLLOCK"
0x40405b = "KEY_LIST"
